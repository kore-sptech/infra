AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infraestrutura como Codigo (IaC) - Pilha de Rede (network-stack) para o Projeto Kore.
  Provisiona VPC, Internet Gateway, Subnet Publica (com NAT Gateway e EIP) e Subnet Privada,
  com suas respectivas Tabelas de Rotas e associacoes na AZ us-east-1b.

Parameters:
  StudentTag:
    Description: 'Identificador do estudante/projeto para nomenclatura e rastreamento de custos (RA-Nome).'
    Type: String
    Default: '01251020-henry'
    AllowedPattern: '^[a-zA-Z0-9-_]+$'
    ConstraintDescription: 'O identificador deve conter apenas caracteres alfanumericos, hifens ou sublinhados.'

  VpcCidr:
    Description: 'Bloco CIDR para a Virtual Private Cloud (VPC)'
    Type: String
    Default: '10.0.0.0/20'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: 'Deve ser um bloco CIDR IPv4 valido no formato x.x.x.x/x (ex: 10.0.0.0/20).'

  PublicSubnetCidr:
    Description: 'Bloco CIDR para a Subnet Publica (Proxy Nginx / Frontend)'
    Type: String
    Default: '10.0.1.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: 'Deve ser um bloco CIDR IPv4 valido no formato x.x.x.x/x (ex: 10.0.1.0/24).'

  PrivateSubnetCidr:
    Description: 'Bloco CIDR para a Subnet Privada (Backend Spring Boot / RabbitMQ)'
    Type: String
    Default: '10.0.2.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: 'Deve ser um bloco CIDR IPv4 valido no formato x.x.x.x/x (ex: 10.0.2.0/24).'

  AvailabilityZone:
    Description: 'Zona de disponibilidade para as subnets publica e privada'
    Type: AWS::EC2::AvailabilityZone::Name
    Default: 'us-east-1b'
    ConstraintDescription: 'Deve ser uma Availability Zone valida na regiao AWS escolhida (ex: us-east-1b).'

Resources:
  # ============================================================================
  # 1. VPC (Virtual Private Cloud)
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${StudentTag}-vpc'
        - Key: StudentTag
          Value: !Ref StudentTag

  # ============================================================================
  # 2. INTERNET GATEWAY & ATTACHMENT
  # ============================================================================
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${StudentTag}-igw'
        - Key: StudentTag
          Value: !Ref StudentTag

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ============================================================================
  # 3. SUBNETS (PUBLIC & PRIVATE)
  # ============================================================================
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${StudentTag}-public-subnet'
        - Key: StudentTag
          Value: !Ref StudentTag

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${StudentTag}-private-subnet'
        - Key: StudentTag
          Value: !Ref StudentTag

  # ============================================================================
  # 4. ELASTIC IP & NAT GATEWAY
  # ============================================================================
  NatPublicIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${StudentTag}-nat-eip'
        - Key: StudentTag
          Value: !Ref StudentTag

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: AttachInternetGateway
    Properties:
      AllocationId: !GetAtt NatPublicIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${StudentTag}-nat-gw'
        - Key: StudentTag
          Value: !Ref StudentTag

  # ============================================================================
  # 5. PUBLIC ROUTE TABLE & ASSOCIATIONS
  # ============================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${StudentTag}-public-rt'
        - Key: StudentTag
          Value: !Ref StudentTag

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ============================================================================
  # 6. PRIVATE ROUTE TABLE & ASSOCIATIONS
  # ============================================================================
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${StudentTag}-private-rt'
        - Key: StudentTag
          Value: !Ref StudentTag

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

# ==============================================================================
# OUTPUTS
# ==============================================================================
Outputs:
  VpcId:
    Description: 'ID da Virtual Private Cloud (VPC)'
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  PublicSubnetId:
    Description: 'ID da Subnet Publica (Proxy Nginx / Frontend)'
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetId'

  PrivateSubnetId:
    Description: 'ID da Subnet Privada (Backend Spring Boot / RabbitMQ)'
    Value: !Ref PrivateSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetId'

  InternetGatewayId:
    Description: 'ID do Internet Gateway (IGW)'
    Value: !Ref InternetGateway
    Export:
      Name: !Sub '${AWS::StackName}-InternetGatewayId'

  NatGatewayId:
    Description: 'ID do NAT Gateway'
    Value: !Ref NatGateway
    Export:
      Name: !Sub '${AWS::StackName}-NatGatewayId'

  PublicRouteTableId:
    Description: 'ID da Tabela de Rotas Publica'
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub '${AWS::StackName}-PublicRouteTableId'

  PrivateRouteTableId:
    Description: 'ID da Tabela de Rotas Privada'
    Value: !Ref PrivateRouteTable
    Export:
      Name: !Sub '${AWS::StackName}-PrivateRouteTableId'

  NatPublicIP:
    Description: 'Endereco IP Publico Elastico associado ao NAT Gateway'
    Value: !Ref NatPublicIP
    Export:
      Name: !Sub '${AWS::StackName}-NatPublicIP'
