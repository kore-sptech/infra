# Balanceamento entre os 2 containers de frontend (latest e v1); so a navegacao (HTML) usa este pool
upstream frontend_cluster {
    # Estado do round-robin compartilhado entre os workers do Nginx
    zone frontend_cluster 64k;
    server frontend-1:80;
    server frontend-2:80;
    keepalive 32;
}

# Mesmos containers, com round-robin proprio para JS/CSS/imagens nao atrapalharem a alternancia do HTML
upstream frontend_static {
    server frontend-1:80;
    server frontend-2:80;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # API no mesmo origin do front (sem CORS): /api/auth/login -> kore-main:8080/auth/login
    location /api/ {
        proxy_pass http://kore-main:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # necessário para o SSE (/sse/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 20m;
    }

    location / {
        proxy_pass http://frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cada build (latest e v1) gera arquivos com hash proprio: em 404, tenta o outro container
        location ~* \.[a-z0-9]+$ {
            proxy_pass http://frontend_static;
            proxy_next_upstream error timeout http_404;
        }
    }
}
