services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-1
      - frontend-2
      - frontend-3
    restart: always

  # Instância 1 do Frontend (puxando a imagem do Docker Hub)
  frontend-1:
    image: henryfranz/kore-front-end:latest
    container_name: frontend-1
    restart: always

  # Instância 2 do Frontend (puxando a imagem do Docker Hub)
  frontend-2:
    image: henryfranz/kore-front-end:latest
    container_name: frontend-2
    restart: always

  # Instância 3 do Frontend (puxando a imagem do Docker Hub)
  frontend-3:
    image: henryfranz/kore-front-end:latest
    container_name: frontend-3
    restart: always

  kore-main:
    image: henryfranz/kore-back-end-main:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  kore-notification:
    image: henryfranz/kore-back-end-notification:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  database:
    image: mysql:9
    user: "0:0"
    ports:
      - "127.0.0.1:3306:3306"
    command: --bind-address=0.0.0.0 --socket=/var/run/mysqld/mysqld.sock --default-time-zone=America/Sao_Paulo
    env_file:
      - .env
    tmpfs:
      - /var/run/mysqld
    volumes:
      - MYSQL_DATA:/var/lib/mysql:z
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  MYSQL_DATA:
